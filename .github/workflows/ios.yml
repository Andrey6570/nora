name: iOS build

# Manual only: macOS runner minutes cost 10x Linux minutes.
on:
  workflow_dispatch:
    inputs:
      signed:
        description: "Also build a signed IPA and upload it to TestFlight (needs the Apple secrets, see README)"
        type: boolean
        default: false

jobs:
  simulator:
    # An unsigned build for the iOS Simulator: proves the project compiles. It cannot be installed on a real iPhone.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Firebase config for iOS (optional)
        env: { PLIST: "${{ secrets.IOS_GOOGLE_SERVICE_INFO_B64 }}" }
        run: |
          if [ -n "$PLIST" ]; then
            # the secret may hold the plist as base64 or pasted as plain text
            if echo "$PLIST" | grep -q "<plist"; then echo "$PLIST" > ios/App/App/GoogleService-Info.plist; else echo "$PLIST" | tr -d ' \r\n' | base64 --decode > ios/App/App/GoogleService-Info.plist; fi
            plutil -lint ios/App/App/GoogleService-Info.plist || { echo "::error::IOS_GOOGLE_SERVICE_INFO_B64 is not a valid GoogleService-Info.plist (neither base64 nor plain text)"; exit 1; }
          else echo "no GoogleService-Info.plist secret: Google/Apple sign-in will not work in this build"; fi
      - name: Google sign-in URL scheme from GoogleService-Info.plist
        run: |
          P=ios/App/App/GoogleService-Info.plist
          if [ -f "$P" ]; then
            R=$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' "$P")
            I=ios/App/App/Info.plist
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$I" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$I"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$I"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $R" "$I"
          else echo "no plist: Google sign-in URL scheme not added"; fi
      - name: Add GoogleService-Info.plist to the app bundle (a file in the folder is not enough, the project must list it)
        run: |
          [ -f ios/App/App/GoogleService-Info.plist ] || { echo "no plist, skipping"; exit 0; }
          ruby -e 'require "xcodeproj"; pr = Xcodeproj::Project.open("ios/App/App.xcodeproj"); t = pr.targets.find { |x| x.name == "App" }; g = pr.main_group["App"]; ref = g.new_file("GoogleService-Info.plist"); t.resources_build_phase.add_file_reference(ref); pr.save'
          grep -c "GoogleService-Info.plist" ios/App/App.xcodeproj/project.pbxproj
      - run: |
          npx vite build
          npx cap sync ios
      - name: Build for the simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -30
      - run: cd build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/Folia-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with: { name: Folia-ios-simulator, path: Folia-simulator.zip }

  testflight:
    # Signing is automatic: the App Store Connect API key lets xcodebuild create the distribution certificate and profile in your Apple account.
    if: ${{ inputs.signed }}
    runs-on: macos-15
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KID: ${{ secrets.ASC_KEY_ID }}
      ISS: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Select Xcode 26 (App Store Connect requires the iOS 26 SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "::error::no Xcode 26 on this runner image"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$X"; xcodebuild -version
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Check the secrets and write the key files
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_B64 }}
        run: |
          for v in TEAM KID ISS P8 PLIST; do [ -n "${!v}" ] || { echo "::error::secret for $v is missing (see README, iOS section)"; exit 1; }; done
          if echo "$PLIST" | grep -q "<plist"; then echo "$PLIST" > ios/App/App/GoogleService-Info.plist; else echo "$PLIST" | tr -d ' \r\n' | base64 --decode > ios/App/App/GoogleService-Info.plist; fi
          plutil -lint ios/App/App/GoogleService-Info.plist || { echo "::error::IOS_GOOGLE_SERVICE_INFO_B64 is not a valid GoogleService-Info.plist (neither base64 nor plain text)"; exit 1; }
          echo "$P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Google sign-in URL scheme from GoogleService-Info.plist
        run: |
          R=$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' ios/App/App/GoogleService-Info.plist)
          I=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$I" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$I"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$I"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $R" "$I"
      - name: Add GoogleService-Info.plist to the app bundle (a file in the folder is not enough, the project must list it)
        run: |
          [ -f ios/App/App/GoogleService-Info.plist ] || { echo "no plist, skipping"; exit 0; }
          ruby -e 'require "xcodeproj"; pr = Xcodeproj::Project.open("ios/App/App.xcodeproj"); t = pr.targets.find { |x| x.name == "App" }; g = pr.main_group["App"]; ref = g.new_file("GoogleService-Info.plist"); t.resources_build_phase.add_file_reference(ref); pr.save'
          grep -c "GoogleService-Info.plist" ios/App/App.xcodeproj/project.pbxproj
      - run: |
          npx vite build
          npx cap sync ios
      - name: Remove old development certificates that earlier CI runs created (Apple allows only a few)
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography requests
          python3 - <<'PY'
          import os, time, jwt, requests
          key = open(os.environ["ASC_KEY_PATH"]).read()
          tok = jwt.encode({"iss": os.environ["ISS"], "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": os.environ["KID"]})
          h = {"Authorization": "Bearer " + tok}
          r = requests.get("https://api.appstoreconnect.apple.com/v1/certificates", headers=h, params={"limit": 200}); r.raise_for_status()
          for c in r.json()["data"]:
              a = c["attributes"]
              mine = (a.get("name") or "").strip().lower().endswith(": created via api") and a.get("certificateType") in ("DEVELOPMENT", "IOS_DEVELOPMENT")
              print(a.get("certificateType"), a.get("name"), "->", "revoke" if mine else "keep")
              if mine:
                  requests.delete("https://api.appstoreconnect.apple.com/v1/certificates/" + c["id"], headers=h).raise_for_status()
          PY
      - name: Register a placeholder device (Apple wants one device before it creates the profile)
        run: |
          jq -n --arg k "$KID" --arg i "$ISS" --rawfile p "$ASC_KEY_PATH" '{key_id:$k, issuer_id:$i, key:$p, in_house:false}' > "$RUNNER_TEMP/asc.json"
          fastlane run register_device name:"CI placeholder" udid:"00008101-000A1B2C3D4E5F60" api_key_path:"$RUNNER_TEMP/asc.json" team_id:"$TEAM" 2>&1 | tail -8 || true
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Folia.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" archive | tail -40
      - name: Export IPA
        run: |
          cat > build/export.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath build/Folia.xcarchive -exportPath build/ipa -exportOptionsPlist build/export.plist \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"
      - uses: actions/upload-artifact@v4
        with: { name: Folia-ios-ipa, path: build/ipa/*.ipa }
      - name: Upload to TestFlight
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$ASC_KEY_PATH" ~/.appstoreconnect/private_keys/AuthKey_$KID.p8
          xcrun altool --upload-app --type ios --file build/ipa/*.ipa --apiKey "$KID" --apiIssuer "$ISS"
