name: iOS build

# Manual only: macOS runner minutes cost 10x Linux minutes.
on:
  workflow_dispatch:
    inputs:
      signed:
        description: "Also build a signed IPA and upload it to TestFlight (needs the Apple secrets, see README)"
        type: boolean
        default: false

jobs:
  simulator:
    # An unsigned build for the iOS Simulator: proves the project compiles. It cannot be installed on a real iPhone.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Firebase config for iOS (optional)
        env: { PLIST: "${{ secrets.IOS_GOOGLE_SERVICE_INFO_B64 }}" }
        run: |
          if [ -n "$PLIST" ]; then echo "$PLIST" | base64 --decode > ios/App/App/GoogleService-Info.plist; else echo "no GoogleService-Info.plist secret: Google/Apple sign-in will not work in this build"; fi
      - name: Google sign-in URL scheme from GoogleService-Info.plist
        run: |
          P=ios/App/App/GoogleService-Info.plist
          if [ -f "$P" ]; then
            R=$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' "$P")
            I=ios/App/App/Info.plist
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$I" || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$I"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$I"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $R" "$I"
          else echo "no plist: Google sign-in URL scheme not added"; fi
      - run: |
          npx vite build
          npx cap sync ios
      - name: Build for the simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -30
      - run: cd build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/Nora-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with: { name: Nora-ios-simulator, path: Nora-simulator.zip }

  testflight:
    # Signing is automatic: the App Store Connect API key lets xcodebuild create the distribution certificate and profile in your Apple account.
    if: ${{ inputs.signed }}
    runs-on: macos-15
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KID: ${{ secrets.ASC_KEY_ID }}
      ISS: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Check the secrets and write the key files
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_B64 }}
        run: |
          for v in TEAM KID ISS P8 PLIST; do [ -n "${!v}" ] || { echo "::error::secret for $v is missing (see README, iOS section)"; exit 1; }; done
          echo "$PLIST" | base64 --decode > ios/App/App/GoogleService-Info.plist
          echo "$P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Google sign-in URL scheme from GoogleService-Info.plist
        run: |
          R=$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' ios/App/App/GoogleService-Info.plist)
          I=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$I" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$I"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$I"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $R" "$I"
      - run: |
          npx vite build
          npx cap sync ios
      - name: Archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Nora.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" archive | tail -40
      - name: Export IPA
        run: |
          cat > build/export.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath build/Nora.xcarchive -exportPath build/ipa -exportOptionsPlist build/export.plist \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"
      - uses: actions/upload-artifact@v4
        with: { name: Nora-ios-ipa, path: build/ipa/*.ipa }
      - name: Upload to TestFlight
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$ASC_KEY_PATH" ~/.appstoreconnect/private_keys/AuthKey_$KID.p8
          xcrun altool --upload-app --type ios --file build/ipa/*.ipa --apiKey "$KID" --apiIssuer "$ISS"
