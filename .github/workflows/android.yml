name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image already ships the Android SDK; only the licences need accepting so Gradle can fetch platform packages.
      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build web app and sync into the Android project
        run: |
          npx vite build
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nora-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish the APK as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android/app/build/outputs/apk/*/*.apk | head -1)
          cp "$APK" nora.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest nora.apk \
            --title "Нора, сборка №${GITHUB_RUN_NUMBER}" \
            --notes "Сборка из коммита ${GITHUB_SHA::7}. Скачайте nora.apk на телефон и установите." \
            --target "$GITHUB_SHA"
