name: Deploy Firebase (functions and rules)

# Publishes the server functions (stars, clean-up) and the database rules to the project named in .firebaserc.
# Needs the FIREBASE_SERVICE_ACCOUNT secret (see README). Run it by hand once, then it runs on changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["functions/**", "firestore.rules", "firebase.json", ".firebaserc", ".github/workflows/deploy-firebase.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the service account secret exists
        id: secret
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then echo "FIREBASE_SERVICE_ACCOUNT is not set yet, skipping the deploy"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.secret.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.secret.outputs.ok == 'true'
        run: |
          npm ci
          cd functions && npm ci

      - name: Tests (server logic and database rules on the emulator)
        if: steps.secret.outputs.ok == 'true'
        run: |
          (cd functions && npm test)
          npm run test:rules

      - uses: google-github-actions/auth@v2
        if: steps.secret.outputs.ok == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # firebase deploy checks the billing plan through this API but does not enable it itself
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.secret.outputs.ok == 'true'

      - name: Enable the Cloud Billing API
        if: steps.secret.outputs.ok == 'true'
        run: |
          PROJECT=$(node -p 'JSON.parse(require("fs").readFileSync(".firebaserc", "utf8")).projects.default')
          # the error goes into an annotation, so it is visible without opening the log
          OUT=$(gcloud services enable cloudbilling.googleapis.com --project "$PROJECT" 2>&1) || { echo "::error::$(echo "$OUT" | tr '\n' ' ')"; exit 1; }
          echo "$OUT"

      - name: Deploy
        if: steps.secret.outputs.ok == 'true'
        run: |
          deploy() { npx firebase deploy --only functions,firestore:rules --non-interactive --force 2>&1 | tee deploy.log; return ${PIPESTATUS[0]}; }
          deploy && CODE=0 || CODE=$?
          # a failed first deploy can leave a function without its trigger, which Firebase then refuses to update:
          # delete such functions and deploy once more
          BROKEN=$(grep -oE '\[[A-Za-z0-9]+\([a-z0-9-]+\)\] Changing from an HTTPS function' deploy.log | sed -E 's/^\[([A-Za-z0-9]+)\(([a-z0-9-]+)\).*/\1 \2/' | sort -u)
          if [ "$CODE" != 0 ] && [ -n "$BROKEN" ]; then
            echo "$BROKEN" | while read -r NAME REGION; do npx firebase functions:delete "$NAME" --region "$REGION" --force; done
            deploy && CODE=0 || CODE=$?
          fi
          # error lines go into an annotation, so they are visible without opening the log
          if [ "$CODE" != 0 ]; then echo "::error::$(grep -iE 'error|fail|denied|permission' deploy.log | tail -8 | tr '\n' ' ')"; exit "$CODE"; fi
