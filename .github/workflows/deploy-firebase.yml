name: Deploy Firebase (functions and rules)

# Publishes the server functions (stars, clean-up) and the database rules to the project named in .firebaserc.
# Needs the FIREBASE_SERVICE_ACCOUNT secret (see README). Run it by hand once, then it runs on changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["functions/**", "firestore.rules", "firebase.json", ".firebaserc"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the service account secret exists
        id: secret
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then echo "FIREBASE_SERVICE_ACCOUNT is not set yet, skipping the deploy"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.secret.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.secret.outputs.ok == 'true'
        run: |
          npm ci
          cd functions && npm ci

      - name: Tests (server logic and database rules on the emulator)
        if: steps.secret.outputs.ok == 'true'
        run: |
          (cd functions && npm test)
          npm run test:rules

      - uses: google-github-actions/auth@v2
        if: steps.secret.outputs.ok == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy
        if: steps.secret.outputs.ok == 'true'
        run: npx firebase deploy --only functions,firestore:rules --non-interactive --force
